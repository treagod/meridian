minimumLimaVersion: 2.0.0

base:
  - template:_images/ubuntu-24.04

vmType: vz
cpus: 4
memory: 6GiB
disk: 30GiB

mounts: []

containerd:
  system: false
  user: false

networks:
  - vzNAT: true

ssh:
  loadDotSSHPubKeys: false

provision:
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      echo "root:meridian-e2e" | chpasswd

      cat >/etc/ssh/sshd_config.d/00-meridian-e2e.conf <<'EOF'
      PermitRootLogin yes
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
      EOF

      # The removal service must never own a long-running process: apt-triggered
      # needrestart restarts flagged units synchronously during bootstrap, and a
      # blocking oneshot deadlocks the whole run. A path unit waits instead.
      cat >/etc/systemd/system/meridian-e2e-remove-root-password-ssh.service <<'EOF'
      [Unit]
      Description=Remove temporary Meridian E2E root password SSH access

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'rm -f /etc/ssh/sshd_config.d/00-meridian-e2e.conf; systemctl reload ssh'
      EOF

      cat >/etc/systemd/system/meridian-e2e-remove-root-password-ssh.path <<'EOF'
      [Unit]
      Description=Watch for the Meridian E2E deploy key to remove root password SSH access

      [Path]
      PathExists=/home/deploy/.ssh/authorized_keys

      [Install]
      WantedBy=multi-user.target
      EOF

      systemctl daemon-reload
      systemctl enable --now meridian-e2e-remove-root-password-ssh.path
      systemctl restart ssh
