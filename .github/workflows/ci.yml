name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Crystal ${{ matrix.crystal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest version CI actually exercises, plus the latest release. The
        # shard.yml floor is >= 1.17.0.
        crystal: ["1.20.2", "1.21.0"]
    container:
      image: crystallang/crystal:${{ matrix.crystal }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: shards install
      - name: Run specs
        run: crystal spec

  format:
    name: Format check
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.21.0
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: crystal tool format --check -e tmp

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      # Pinned to 1.20.2 while the rest of CI runs 1.21.0: ameba's tokenizer
      # calls Crystal::Lexer#next_string_array_token, which 1.21 made private
      # ("Error: undefined method 'next_string_array_token' for Crystal::Lexer"
      # at lib/ameba/src/ameba/tokenizer.cr:88). Lift this pin once ameba
      # supports 1.21 and the commit in shard.yml is moved forward.
      image: crystallang/crystal:1.20.2
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: shards install
      # bin/ is gitignored, so run the ameba wrapper straight from lib/
      # (equivalent to the `make lint` target devs run locally).
      - name: Run ameba
        run: crystal run lib/ameba/bin/ameba.cr

  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.21.0
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: shards install --without-development
      - name: Build release binary
        run: crystal build src/meridian_cli.cr --release -o meridian
