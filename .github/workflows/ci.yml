name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.20.2
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: shards install
      - name: Run specs
        run: crystal spec

  format:
    name: Format check
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.20.2
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: crystal tool format --check -e tmp

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.20.2
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: shards install
      # bin/ is gitignored, so run the ameba wrapper straight from lib/
      # (equivalent to the `make lint` target devs run locally).
      - name: Run ameba
        run: crystal run lib/ameba/bin/ameba.cr

  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.20.2
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: shards install --without-development
      - name: Build release binary
        run: crystal build src/meridian_cli.cr --release -o meridian
